<script>
  document.querySelectorAll('a').forEach(link => {
    if (link.href && !link.href.includes('#') && !link.href.startsWith('mailto')) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location = link.href;
        }, 300);
      });
    }
  });
</script>
